# DEVELOPMENT environment only. Redis is included now; the Celery worker is added in Phase 3.
# Setup: `cp .env.example .env` first (the api service reads .env; compose also reads it for
# ${POSTGRES_PASSWORD}). The credentials in .env.example are example values for local development
# only. Never commit .env. See README.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: outfitmaxing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outfitmaxing}
      POSTGRES_DB: outfitmaxing
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfitmaxing"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://outfitmaxing:${POSTGRES_PASSWORD:-outfitmaxing}@db:5432/outfitmaxing
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]
volumes:
  pgdata:
