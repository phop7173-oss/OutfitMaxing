name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no .env file is tracked
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v -E '(^|/)\.env\.example$'; then
            echo "A .env file is tracked in Git. Remove it and rotate any secrets it held."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-docker.txt -r requirements-dev.txt ruff==0.8.4
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
